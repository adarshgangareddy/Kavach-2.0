[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroday-sentinel"
version = "0.1.0"
description = "Flask vulnerability scanner (Hack Fest 2026 PS-01)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7",
    "cryptography>=42",  # AES-256-GCM encryption of scan workspaces at rest
    "argon2-cffi>=23",   # password hashing (Argon2id)
    "PyJWT>=2.8",        # signed session tokens
    "slowapi>=0.1.9",    # login rate limiting
    "python-dotenv>=1.0",  # secrets from backend/.env
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Training the ML ranker only. Scans score with the exported JSON weights.
ml = ["scikit-learn>=1.5"]

[project.scripts]
sentinel = "app.cli:main"
sentinel-hook = "app.early.hook:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
