name: ZeroDay Sentinel PR scan

on:
  pull_request:

# pull_request (not pull_request_target): fork PRs get a read-only token and no secrets.
permissions:
  contents: read
  actions: read          # upload-sarif reads the workflow run
  security-events: write # upload-sarif writes code-scanning results

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner
        run: pip install ./backend bandit

      - name: Scan changed code
        id: scan
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          SENTINEL_RULES: backend/sentinel-rules.toml
        run: >
          sentinel scan . --diff-base "origin/$BASE_REF"
          --format sarif --out sentinel.sarif --fail-on 7

      - name: Validate SARIF
        if: always()
        run: sentinel validate-sarif sentinel.sarif

      # Annotations appear on the PR's changed lines and need no extra GitHub features.
      - name: Annotate pull request
        if: always()
        run: sentinel annotate sentinel.sarif

      - name: Keep SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-sarif
          path: sentinel.sarif
          if-no-files-found: ignore

      # Code scanning on a private repository needs GitHub Advanced Security.
      # Without it this upload fails, which must not fail the check.
      - name: Upload results to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sentinel.sarif
          category: zeroday-sentinel

      - name: Fail on high-severity findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::ZeroDay Sentinel found severity >= 7 issues in changed code."
          exit 1
