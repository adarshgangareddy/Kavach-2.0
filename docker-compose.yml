# Run Kavach with one command:
#   cp backend/.env.example backend/.env    # then fill in the secrets
#   docker compose up --build
# Open http://localhost:8080 and sign in with the admin from backend/.env.

services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SENTINEL_DATA: /data
      # Plain http on localhost. Set to "true" when serving Kavach over HTTPS.
      SENTINEL_COOKIE_SECURE: "false"
    volumes:
      - kavach-data:/data      # SQLite database, encrypted scans, vault key
    restart: unless-stopped
    # Not published: only the dashboard container talks to the API.

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"  # this machine only
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kavach-data:
